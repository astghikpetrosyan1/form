name: Update dist branch

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update-dist:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build

      - name: Prepare dist contents
        run: |
          rm -rf /tmp/dist-contents
          mkdir -p /tmp/dist-contents
          cp -R lib/. /tmp/dist-contents/

      - name: Switch to dist branch
        run: |
          if git ls-remote --exit-code --heads origin dist; then
            git fetch origin dist
            git checkout dist
            git reset --hard origin/dist
          else
            git checkout --orphan dist
            git rm -rf . || true
          fi

      - name: Replace branch contents
        run: |
          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          cp -R /tmp/dist-contents/. .
          test -f package.json

      - name: Commit changes if needed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update dist from ${GITHUB_SHA}"
          fi

      - name: Push dist branch
        run: |
          git push origin dist --force
